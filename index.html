<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>فيل هندي بيطير بين النجوم</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(#000011, #000000);
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 2.5em;
      text-shadow: 0 0 10px #fff;
    }

    #elephant {
      position: absolute;
      width: 100px;
      height: 100px;
      background-image: url("https://cdn.discordapp.com/attachments/1297303982170963999/1361309143725637773/IMG__.jpg?ex=67fe496f&is=67fcf7ef&hm=3a4f70d9d7a35a95b3381b415f6903f830818aa28d0b8db98f7205d6462d6975&");
      background-size: cover;
      animation: float 10s infinite linear;
    }

    @keyframes float {
      0% {
        top: 100%;
        left: -100px;
        transform: rotate(0deg);
      }
      50% {
        left: 50%;
        top: 30%;
        transform: rotate(20deg);
      }
      100% {
        top: -100px;
        left: 110%;
        transform: rotate(-20deg);
      }
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <h1>خخخخ هات جنيه </h1>
  <div id="elephant"></div>

  <script>
    // نجوم متحركة
    const starsCount = 100;
    for (let i = 0; i < starsCount; i++) {
      const star = document.createElement("div");
      star.classList.add("star");
      star.style.top = Math.random() * 100 + "vh";
      star.style.left = Math.random() * 100 + "vw";
      star.style.animationDuration = (1 + Math.random() * 2) + "s";
      document.body.appendChild(star);
    }
  </script>
</body>
</html>
